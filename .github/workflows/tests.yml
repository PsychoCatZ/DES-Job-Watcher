name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m examples.validate_analysis --demo
      - run: python -m examples.setup_demo_profiles
      - run: python -m examples.run_evaluation --manifest examples/fixtures/evaluation/cases.json
